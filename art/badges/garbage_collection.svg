<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Garbage Collection: a node drained to its last sliver, and the whole
       branch beneath it already coming apart. Slate = the structure that
       survives; teal = what the collector reclaims. -->
  <defs>
    <clipPath id="gc_parent">
      <polygon points="342,130 299,204.5 213,204.5 170,130 213,55.5 299,55.5"/>
    </clipPath>
  </defs>

  <!-- links down to the children, already breaking up -->
  <g stroke="#2fe3d0" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M216,208 L163,247" stroke-dasharray="26 19"/>
    <path d="M296,208 L349,247" stroke-dasharray="26 19"/>
  </g>

  <!-- children: dissolving, not yet gone -->
  <g fill="none" stroke="#2fe3d0" stroke-width="12" stroke-linejoin="round" opacity="0.85">
    <polygon points="186,300 157,350.2 99,350.2 70,300 99,249.8 157,249.8"
             stroke-dasharray="32 18"/>
    <polygon points="442,300 413,350.2 355,350.2 326,300 355,249.8 413,249.8"
             stroke-dasharray="32 18"/>
  </g>

  <!-- the rest of the sub-tree, reduced to drifting fragments -->
  <g fill="#2fe3d0">
    <circle cx="96"  cy="404" r="14" opacity="0.75"/>
    <circle cx="163" cy="436" r="10" opacity="0.60"/>
    <circle cx="216" cy="400" r="8"  opacity="0.45"/>
    <circle cx="256" cy="447" r="12" opacity="0.55"/>
    <circle cx="296" cy="400" r="8"  opacity="0.45"/>
    <circle cx="349" cy="438" r="10" opacity="0.60"/>
    <circle cx="416" cy="402" r="14" opacity="0.75"/>
    <circle cx="128" cy="470" r="7"  opacity="0.32"/>
    <circle cx="256" cy="486" r="6"  opacity="0.28"/>
    <circle cx="384" cy="470" r="7"  opacity="0.32"/>
  </g>

  <!-- parent node: intact shell, drained to its last 15% -->
  <polygon points="342,130 299,204.5 213,204.5 170,130 213,55.5 299,55.5"
           fill="#0d1117" stroke="#6b8c96" stroke-width="16" stroke-linejoin="round"/>
  <g clip-path="url(#gc_parent)">
    <rect x="162" y="182" width="188" height="26" fill="#2fe3d0"/>
  </g>
  <!-- threshold line: where the sliver begins -->
  <line x1="192" y1="182" x2="320" y2="182"
        stroke="#7af0e3" stroke-width="7" stroke-linecap="round"/>
</svg>
