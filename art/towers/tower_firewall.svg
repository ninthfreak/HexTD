<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <path d="M232.0,120.0 L176.0,217.0 L64.0,217.0 L8.0,120.0 L64.0,23.0 L176.0,23.0 Z" fill="none" stroke="#ff8a4f" stroke-width="16" stroke-linejoin="round" opacity="0.28"/>
  <path d="M232.0,120.0 L176.0,217.0 L64.0,217.0 L8.0,120.0 L64.0,23.0 L176.0,23.0 Z" fill="#161B22" stroke="#ff8a4f" stroke-width="5" stroke-linejoin="round"/>

  <!-- a wall of rules laid across the route, staggered like brickwork -->
  <g fill="#ff8a4f">
    <rect x="52"  y="96"  width="42" height="17" rx="4" opacity="0.95"/>
    <rect x="100" y="96"  width="42" height="17" rx="4" opacity="0.80"/>
    <rect x="148" y="96"  width="40" height="17" rx="4" opacity="0.62"/>

    <rect x="66"  y="121" width="42" height="17" rx="4" opacity="0.80"/>
    <rect x="114" y="121" width="42" height="17" rx="4" opacity="0.62"/>
    <rect x="162" y="121" width="26" height="17" rx="4" opacity="0.45"/>

    <rect x="52"  y="146" width="42" height="17" rx="4" opacity="0.62"/>
    <rect x="100" y="146" width="42" height="17" rx="4" opacity="0.45"/>
    <rect x="148" y="146" width="40" height="17" rx="4" opacity="0.32"/>
  </g>

  <!-- traffic arriving at the wall and stopping -->
  <g stroke="#ffd0a8" stroke-width="7" stroke-linecap="round">
    <path d="M40,72 L74,72" opacity="0.9"/>
    <path d="M92,72 L118,72" opacity="0.55"/>
    <path d="M136,72 L154,72" opacity="0.3"/>
  </g>
</svg>
